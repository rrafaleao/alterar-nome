<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapp - Crie sua loja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IM+Fell+Great+Primer+SC&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
        }

        .header {
            padding: 24px 50px 24px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        .brand-name {
            font-family: 'IM Fell Great Primer SC', serif;
            font-size: 64px;
            font-weight: 400;
            color: #000;
            line-height: 1;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 0;
            background: linear-gradient(135deg, #FFB88C 0%, #FF9A6C 100%);
            border-radius: 50px;
            padding: 4px;
        }

        .header-btn {
            font-family: 'Instrument Sans', sans-serif;
            padding: 14px 40px;
            font-size: 22px;
            font-weight: 500;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #FFB88C 0%, #FF9A6C 100%);
            color: #000;
        }

        .header-btn.active {
            background: linear-gradient(135deg, #FFDCC8 0%, #FFC4A8 100%);
        }

        .main-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 80px 100px;
            gap: 60px;
        }

        .left-section {
            flex: 1;
            max-width: 550px;
        }

        .main-title {
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 40px;
            line-height: 1.3;
        }

        .email-form {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .email-input {
            flex: 1;
            padding: 16px 24px;
            font-size: 18px;
            border: 1px solid #e0e0e0;
            border-radius: 50px;
            background-color: #f5f5f5;
        }

        .submit-btn {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .right-section {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .shopping-bags {
            width: 400px;
            height: 400px;
        }

        .shopping-bags img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.1));
        }

        @media (max-width: 1024px) {
            .main-content {
                flex-direction: column;
                padding: 60px 40px;
            }

            .email-form {
                flex-direction: column;
            }

            .submit-btn {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
            }

            .brand-name {
                font-size: 32px;
            }

            .header-btn {
                font-size: 16px;
                padding: 12px 30px;
            }

            .main-title {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo-section">
        <img src="https://dl.airtable.com/.blockIconImages/a30bee50aeefaf4ffd8c4dc699b642c6/d3accafa" class="logo">
        <span class="brand-name">Zapp</span>
    </div>

    <div class="header-buttons">
        <button class="header-btn" onclick="goToLogin()">login</button>
        <button class="header-btn active" onclick="goToCreateStore()">criar loja</button>
    </div>
</header>

<main class="main-content">

    <div class="left-section">
        <h1 class="main-title">
            Crie sua loja agora e comece a vender de forma gratis
        </h1>

        <form class="email-form" onsubmit="handleSubmit(event)">
            <input 
                type="email" 
                class="email-input" 
                placeholder="nome@exemplo.com"
                required
            >

            <button type="submit" class="submit-btn">
                criar loja
            </button>
        </form>
    </div>

    <div class="right-section">
        <div class="shopping-bags">
            <img src="https://cdn-icons-png.flaticon.com/512/5654/5654409.png">
        </div>
    </div>

</main>

<script>

function goToLogin() {
    window.location.href = "/auth/login";
}

function goToCreateStore() {
    window.location.href = "/registration";
}

function handleSubmit(event) {
    event.preventDefault();

    const email = document.querySelector(".email-input").value;

    console.log("Email:", email);

    // redireciona ao clicar
    window.location.href = "criar-loja.html";
}

</script>

</body>
</html>
