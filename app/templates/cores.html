<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Loja - Criar Sua Loja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-500 via-purple-600 to-indigo-700 min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-3 mb-4">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                </svg>
                <h1 class="text-4xl font-bold text-white">Criar Sua Loja</h1>
            </div>
            <p class="text-purple-100 text-lg">Complete as 4 etapas para começar a vender online</p>
        </div>

        <!-- Progress Steps -->
        <div class="bg-white rounded-2xl p-8 mb-8 shadow-xl">
            <div class="flex items-center justify-between mb-8">
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg bg-green-500 text-white">✓</div>
                    <span class="mt-2 text-sm font-medium text-gray-700">Loja</span>
                </div>
                <div class="flex-1 h-1 mx-4 bg-green-500"></div>
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg bg-green-500 text-white">✓</div>
                    <span class="mt-2 text-sm font-medium text-gray-700">Dados</span>
                </div>
                <div class="flex-1 h-1 mx-4 bg-green-500"></div>
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg bg-green-500 text-white">✓</div>
                    <span class="mt-2 text-sm font-medium text-gray-700">Métodos</span>
                </div>
                <div class="flex-1 h-1 mx-4 bg-gray-300"></div>
                <div class="flex flex-col items-center">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg bg-blue-500 text-white">4</div>
                    <span class="mt-2 text-sm font-medium text-gray-700">Visual</span>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-8">
                <!-- Configurações -->
                <div class="space-y-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Personalize sua loja</h2>
                    
                    <!-- Tema -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">Estilo Visual</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="setTheme('colorido')" id="btn-colorido" class="p-4 rounded-xl border-2 border-blue-500 bg-blue-50 transition">
                                <div class="w-full h-20 rounded-lg bg-gradient-to-br from-pink-400 via-purple-400 to-indigo-400 mb-3 shadow-md"></div>
                                <div class="flex items-center gap-2 justify-center mb-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/>
                                    </svg>
                                    <span class="font-medium">Colorido</span>
                                </div>
                                <p class="text-xs text-gray-500 text-center">Visual vibrante com gradientes suaves e efeitos modernos</p>
                            </button>
                            <button onclick="setTheme('elegante')" id="btn-elegante" class="p-4 rounded-xl border-2 border-gray-200 hover:border-gray-300 transition">
                                <div class="w-full h-20 rounded-lg bg-gradient-to-br from-gray-800 via-gray-700 to-gray-900 mb-3 shadow-md"></div>
                                <div class="flex items-center gap-2 justify-center mb-2">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                                    </svg>
                                    <span class="font-medium">Elegante</span>
                                </div>
                                <p class="text-xs text-gray-500 text-center">Design sofisticado com cores sólidas e elementos minimalistas</p>
                            </button>
                        </div>
                    </div>

                    <!-- Logo Upload -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">Logo da Loja (opcional)</label>
                        <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-blue-400 transition cursor-pointer">
                            <input type="file" accept="image/*" id="logo-upload" class="hidden" onchange="handleLogoUpload(event)">
                            <label for="logo-upload" class="cursor-pointer">
                                <div id="logo-preview" class="w-24 h-24 mx-auto bg-gray-100 rounded-lg flex items-center justify-center mb-2">
                                    <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                                    </svg>
                                </div>
                                <p class="text-sm text-gray-600">Clique para escolher uma imagem</p>
                                <p class="text-xs text-gray-400 mt-1">PNG, JPG, GIF ou WEBP (máx. 2MB)</p>
                            </label>
                        </div>
                    </div>

                    <!-- Color Picker -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">Seletor de Cores</label>
                        <div class="bg-gray-50 p-6 rounded-xl border-2 border-gray-200">
                            <!-- Indicador de cor selecionada -->
                            <div class="mb-4">
                                <p class="text-xs text-gray-600 mb-2">Cor sendo editada:</p>
                                <div class="flex gap-3">
                                    <button onclick="document.getElementById('primary-color-input').click()" class="flex-1 p-3 rounded-lg border-2 border-blue-500 bg-blue-50 hover:bg-blue-100 transition">
                                        <div class="flex items-center gap-2">
                                            <div id="primary-preview" class="w-6 h-6 rounded-full border-2 border-white shadow-md" style="background-color: #667eea;"></div>
                                            <div class="text-left flex-1">
                                                <p class="text-xs font-medium text-gray-700">Cor Primária</p>
                                                <p id="primary-hex" class="text-xs text-gray-500 font-mono">#667eea</p>
                                            </div>
                                        </div>
                                    </button>
                                    <button onclick="document.getElementById('secondary-color-input').click()" class="flex-1 p-3 rounded-lg border-2 border-purple-500 bg-purple-50 hover:bg-purple-100 transition">
                                        <div class="flex items-center gap-2">
                                            <div id="secondary-preview" class="w-6 h-6 rounded-full border-2 border-white shadow-md" style="background-color: #764ba2;"></div>
                                            <div class="text-left flex-1">
                                                <p class="text-xs font-medium text-gray-700">Cor Secundária</p>
                                                <p id="secondary-hex" class="text-xs text-gray-500 font-mono">#764ba2</p>
                                            </div>
                                        </div>
                                    </button>
                                </div>
                            </div>

                            <!-- Color Pickers principais -->
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-2">Primária</label>
                                    <input id="primary-color-input" type="color" value="#667eea" onchange="updatePrimaryColor(this.value)" class="w-full h-32 rounded-lg border-2 border-gray-300 cursor-pointer">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-600 mb-2">Secundária</label>
                                    <input id="secondary-color-input" type="color" value="#764ba2" onchange="updateSecondaryColor(this.value)" class="w-full h-32 rounded-lg border-2 border-gray-300 cursor-pointer">
                                </div>
                            </div>

                            <!-- Campos de texto -->
                            <div class="grid grid-cols-2 gap-4 mb-4">
                                <input id="primary-text" type="text" value="#667eea" onchange="updatePrimaryColor(this.value)" class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg font-mono text-sm uppercase text-center focus:border-blue-500 focus:outline-none">
                                <input id="secondary-text" type="text" value="#764ba2" onchange="updateSecondaryColor(this.value)" class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg font-mono text-sm uppercase text-center focus:border-purple-500 focus:outline-none">
                            </div>

                            <!-- Preview do Gradiente -->
                            <div class="mb-4">
                                <p class="text-xs font-medium text-gray-600 mb-2">Preview do Gradiente:</p>
                                <div id="gradient-preview" class="h-16 rounded-lg shadow-md" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);"></div>
                            </div>

                            <!-- Paletas Sugeridas -->
                            <div>
                                <p class="text-xs font-medium text-gray-600 mb-2">Paletas Sugeridas:</p>
                                <div class="grid grid-cols-6 gap-2" id="preset-palettes"></div>
                            </div>

                            <div class="mt-4 pt-4 border-t border-gray-300">
                                <p class="text-xs text-gray-600 text-center">
                                    💡 <strong>Dica:</strong> Clique nos seletores grandes ou nas paletas sugeridas para escolher cores
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Preview -->
                <div>
                    <div class="sticky top-8">
                        <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                            <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                            Preview em Tempo Real
                        </h3>
                        <div id="store-preview" class="transform scale-90 origin-top">
                            <!-- Preview será gerado aqui -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-4 mt-8 pt-8 border-t">
                <button class="px-8 py-3 bg-gray-500 text-white rounded-xl font-medium hover:bg-gray-600 transition flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                    Voltar
                </button>
                <button id="finalize-btn" class="flex-1 py-3 text-white rounded-xl font-medium hover:opacity-90 transition flex items-center justify-center gap-2">
                    Finalizar ✓
                </button>
            </div>
        </div>
    </div>

    <script>
        let storeTheme = 'colorido';
        let primaryColor = '#667eea';
        let secondaryColor = '#764ba2';
        let storeLogo = null;

        const presets = [
            { primary: '#667eea', secondary: '#764ba2' },
            { primary: '#f093fb', secondary: '#f5576c' },
            { primary: '#4facfe', secondary: '#00f2fe' },
            { primary: '#43e97b', secondary: '#38f9d7' },
            { primary: '#fa709a', secondary: '#fee140' },
            { primary: '#30cfd0', secondary: '#330867' },
            { primary: '#FF6B6B', secondary: '#4ECDC4' },
            { primary: '#A8E6CF', secondary: '#FFD3B6' },
            { primary: '#667eea', secondary: '#f093fb' },
            { primary: '#FC466B', secondary: '#3F5EFB' },
            { primary: '#FDBB2D', secondary: '#22C1C3' },
            { primary: '#E44D26', secondary: '#F16529' }
        ];

        function setTheme(theme) {
            storeTheme = theme;
            document.getElementById('btn-colorido').className = theme === 'colorido' 
                ? 'p-4 rounded-xl border-2 border-blue-500 bg-blue-50 transition'
                : 'p-4 rounded-xl border-2 border-gray-200 hover:border-gray-300 transition';
            document.getElementById('btn-elegante').className = theme === 'elegante'
                ? 'p-4 rounded-xl border-2 border-blue-500 bg-blue-50 transition'
                : 'p-4 rounded-xl border-2 border-gray-200 hover:border-gray-300 transition';
            updatePreview();
        }

        function updatePrimaryColor(color) {
            primaryColor = color;
            document.getElementById('primary-color-input').value = color;
            document.getElementById('primary-text').value = color;
            document.getElementById('primary-hex').textContent = color;
            document.getElementById('primary-preview').style.backgroundColor = color;
            document.getElementById('gradient-preview').style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${secondaryColor} 100%)`;
            document.getElementById('finalize-btn').style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${secondaryColor} 100%)`;
            updatePreview();
        }

        function updateSecondaryColor(color) {
            secondaryColor = color;
            document.getElementById('secondary-color-input').value = color;
            document.getElementById('secondary-text').value = color;
            document.getElementById('secondary-hex').textContent = color;
            document.getElementById('secondary-preview').style.backgroundColor = color;
            document.getElementById('gradient-preview').style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${secondaryColor} 100%)`;
            document.getElementById('finalize-btn').style.background = `linear-gradient(135deg, ${primaryColor} 0%, ${secondaryColor} 100%)`;
            updatePreview();
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    storeLogo = e.target.result;
                    document.getElementById('logo-preview').innerHTML = `<img src="${storeLogo}" alt="Logo" class="w-24 h-24 rounded-lg object-cover">`;
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function updatePreview() {
            const isColorful = storeTheme === 'colorido';
            const headerStyle = isColorful 
                ? `background: linear-gradient(135deg, ${primaryColor} 0%, ${secondaryColor} 100%)`
                : `background-color: ${primaryColor}; border-bottom: 4px solid ${secondaryColor}`;
            
            const bannerStyle = isColorful
                ? `background: linear-gradient(135deg, ${primaryColor}dd 0%, ${secondaryColor}dd 100%)`
                : `background-color: ${primaryColor}ee; border: 2px solid ${secondaryColor}`;

            const roundedClass = isColorful ? 'rounded-full' : 'rounded-lg';
            const roundedCard = isColorful ? 'rounded-lg' : 'rounded';

            document.getElementById('store-preview').innerHTML = `
                <div class="bg-gray-50 rounded-lg overflow-hidden shadow-2xl border-4 border-gray-200">
                    <div class="text-white p-4 ${isColorful ? 'shadow-lg' : 'shadow-xl'}" style="${headerStyle}">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3">
                                ${storeLogo 
                                    ? `<img src="${storeLogo}" alt="Logo" class="w-10 h-10 ${roundedClass} bg-white p-1">`
                                    : `<div class="w-10 h-10 ${roundedClass} ${isColorful ? 'bg-white/20' : 'bg-white/30'} flex items-center justify-center">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                                        </svg>
                                    </div>`
                                }
                                <span class="font-bold text-xl">Minha Loja</span>
                            </div>
                            <div class="flex items-center gap-4">
                                <button class="${isColorful ? 'hover:bg-white/10' : 'hover:bg-white/20'} p-2 ${roundedClass} transition">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                    </svg>
                                </button>
                                <button class="${isColorful ? 'hover:bg-white/10' : 'hover:bg-white/20'} p-2 ${roundedClass} transition">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                    </svg>
                                </button>
                                <button class="${isColorful ? 'hover:bg-white/10' : 'hover:bg-white/20'} p-2 ${roundedClass} transition relative">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                                    </svg>
                                    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 ${isColorful ? 'rounded-full' : 'rounded'} flex items-center justify-center">0</span>
                                </button>
                            </div>
                        </div>
                        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                            <button class="flex items-center gap-2 px-4 py-2 ${roundedClass} ${isColorful ? 'bg-white/30' : 'bg-white/40'} font-medium whitespace-nowrap">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                                </svg>
                                <span class="text-sm">Todas Categorias</span>
                            </button>
                        </div>
                    </div>

                    <div class="relative text-white p-8 m-4 ${isColorful ? 'rounded-xl shadow-lg' : 'rounded-lg shadow-xl'}" style="${bannerStyle}">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="text-sm mb-2 opacity-90">Melhor oferta online em produtos</p>
                                <h1 class="text-3xl font-bold mb-2">TECNOLOGIA VESTÍVEL</h1>
                                <p class="text-xl font-semibold">Até 80% OFF</p>
                            </div>
                            <div class="w-64 h-40 border-2 ${isColorful ? 'border-dashed border-white/50 rounded-lg' : 'border-solid border-white/60 rounded'} flex items-center justify-center text-white/50 text-sm">
                                IMAGEM DO PRODUTO
                            </div>
                        </div>
                    </div>

                    <div class="p-4">
                        <h2 class="text-xl font-bold mb-4">
                            Pegue a melhor oferta em <span style="color: ${primaryColor}">Smartphones</span>
                        </h2>
                        <div class="grid grid-cols-4 gap-4">
                            ${[
                                { name: 'Galaxy S23 Ultra', oldPrice: 'R$2999', price: 'R$2099', discount: '52% OFF' },
                                { name: 'Galaxy M13', oldPrice: 'R$1649', price: 'R$399', discount: '64% OFF' },
                                { name: 'Galaxy M33', oldPrice: 'R$1999', price: 'R$1019', discount: '40% OFF' },
                                { name: 'Galaxy M53', oldPrice: 'R$3199', price: 'R$2271', discount: '28% OFF' }
                            ].map(p => `
                                <div class="bg-white ${roundedCard} shadow hover:shadow-lg transition overflow-hidden">
                                    <div class="relative">
                                        <div class="aspect-square bg-gray-100 flex items-center justify-center text-gray-400 text-xs p-4">PRODUTO</div>
                                        <span class="absolute top-2 right-2 text-white text-xs px-2 py-1 ${isColorful ? 'rounded-full' : 'rounded'} font-medium" style="background-color: ${primaryColor}">${p.discount}</span>
                                    </div>
                                    <div class="p-3">
                                        <h3 class="font-medium text-sm mb-2">${p.name}</h3>
                                        <div class="flex items-center gap-2 mb-2">
                                            <span class="text-gray-400 text-xs line-through">${p.oldPrice}</span>
                                            <span class="font-bold" style="color: ${primaryColor}">${p.price}</span>
                                        </div>
                                        <p class="text-xs text-green-600">✓ Economize ${p.discount}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Inicializar paletas sugeridas
        const palettesContainer = document.getElementById('preset-palettes');
        presets.forEach((preset, idx) => {
            const btn = document.createElement('button');
            btn.className = 'aspect-square rounded-lg hover:scale-110 transition shadow-md hover:shadow-lg';
            btn.style.background = `linear-gradient(135deg, ${preset.primary} 0%, ${preset.secondary} 100%)`;
            btn.title = 'Clique para aplicar';
            btn.onclick = () => {
                updatePrimaryColor(preset.primary);
                updateSecondaryColor(preset.secondary);
            };
            palettesContainer.appendChild(btn);
        });

        // Inicializar preview
        updatePreview();
    </script>
</body>
</html>
