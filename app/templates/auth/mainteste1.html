<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Sua Loja - Zapp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+Great+Primer+SC&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            padding: 30px;
            background: white;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .logo-text {
            font-family: 'IM Fell Great Primer SC', serif;
            font-size: 36px;
            color: #333;
            font-weight: normal;
            line-height: 1;
        }

        .header h1 {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 36px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 400;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px 20px;
            background: #e8e8e8;
            color: #666;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            font-family: 'Instrument Sans', sans-serif;
        }

        .tab.active {
            background: #4A90E2;
            color: white;
        }

        .form-content {
            padding: 50px 80px;
        }

        h2 {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 28px;
            color: #333;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 400;
            font-family: 'Instrument Sans', sans-serif;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 15px 20px;
            border: none;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Instrument Sans', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            background: #ebebeb;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 50px;
        }

        button {
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Instrument Sans', sans-serif;
        }

        .btn-cancel {
            background: #d0d0d0;
            color: #666;
        }

        .btn-cancel:hover {
            background: #c0c0c0;
        }

        .btn-next {
            background: #4A90E2;
            color: white;
            flex: 1;
        }

        .btn-next:hover {
            background: #3a7bc8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        @media (max-width: 768px) {
            .form-content {
                padding: 30px;
            }

            .header h1 {
                font-size: 28px;
            }

            .logo-text {
                font-size: 28px;
            }

            .logo-icon {
                width: 35px;
                height: 35px;
            }

            .tab {
                font-size: 14px;
                padding: 12px 10px;
            }

            h2 {
                font-size: 24px;
            }

            label {
                font-size: 16px;
            }

            button {
                padding: 15px 30px;
                font-size: 16px;
            }
        }
    </style>
</head>

            <h1>Criar Sua Loja</h1>
            <div class="tabs">
                <div class="tab active">Etapa 1</div>
                <div class="tab">Etapa 2</div>
                <div class="tab">Etapa 3</div>
            </div>
        </div>

        <div class="form-content">
            <h2>Dados da Loja</h2>
            
            <div class="form-group">
                <label for="store_name">Nome da Loja *</label>
                <input type="text" id="store_name" placeholder="">
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" placeholder="">
            </div>

            <div class="form-group">
                <label for="password">Senha *</label>
                <input type="password" id="password" placeholder="">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirmar Senha *</label>
                <input type="password" id="confirm_password" placeholder="">
            </div>

            <div class="buttons">
                <button type="button" class="btn-cancel">Cancelar</button>
                <button type="button" class="btn-next">Próximo</button>
            </div>
        </div>
    </div>
