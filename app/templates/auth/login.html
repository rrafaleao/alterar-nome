<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapp - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IM+Fell+Great+Primer+SC&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 32px 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            width: 292px;
            height: 102px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .logo {
            width: 104px;
            height: 104px;
            object-fit: contain;
        }

        .brand-name {
            font-family: 'IM Fell Great Primer SC', serif;
            font-size: 64px;
            font-weight: 400;
            color: #000;
            line-height: 1;
        }

        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .login-box {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 78px;
            font-weight: 600;
            color: #000;
            margin-bottom: 20px;
            line-height: 1;
        }

        .subtitle {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 24px;
            color: #666;
            margin-bottom: 60px;
        }

        .input-group {
            margin-bottom: 28px;
            text-align: left;
        }

        input {
            font-family: 'Instrument Sans', sans-serif;
            width: 100%;
            padding: 24px 26px;
            font-size: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            background-color: #f5f5f5;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4A90E2;
            background-color: #fff;
        }

        input::placeholder {
            color: #999;
        }

        .password-input {
            position: relative;
        }

        .password-input input {
            padding-right: 70px;
        }

        .toggle-password {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password svg {
            width: 32px;
            height: 32px;
            stroke: #666;
            stroke-width: 2.5;
            fill: none;
        }

        .forgot-password {
            text-align: left;
            margin-bottom: 36px;
        }

        .forgot-password a {
            font-family: 'Instrument Sans', sans-serif;
            color: #000;
            text-decoration: none;
            font-size: 18px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-button {
            font-family: 'Instrument Sans', sans-serif;
            width: 100%;
            padding: 24px;
            font-size: 22px;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            border: none;
            border-radius: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(74, 144, 226, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .header {
                padding: 24px 30px;
            }
            
            .logo {
                width: 38px;
                height: 38px;
            }
            
            .brand-name {
                font-size: 32px;
            }
            
            h1 {
                font-size: 32px;
            }
            
            .login-box {
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://dl.airtable.com/.blockIconImages/a30bee50aeefaf4ffd8c4dc699b642c6/d3accafa" alt="Zapp Logo" class="logo">
        <span class="brand-name">Zapp</span>
    </div>

    <div class="login-container">
        <div class="login-box">
            <h1>Login</h1>
            <p class="subtitle">Acesse sua conta para gerenciar sua loja</p>

            <form id="loginForm">
                <div class="input-group">
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="nome@exemplo.com"
                        required
                    >
                </div>

                <div class="input-group password-input">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="senha forte"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <svg viewBox="0 0 24 24" id="eyeIcon">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <div class="forgot-password">
                    <a href="#" onclick="handleForgotPassword(event)">Esqueci minha senha</a>
                </div>

                <button type="submit" class="login-button">
                    Acessar a minha loja
                </button>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            const isPassword = passwordInput.type === 'password';
            
            passwordInput.type = isPassword ? 'text' : 'password';
            
            if (isPassword) {
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            alert('Funcionalidade de recuperação de senha será implementada aqui!');
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Login attempt:', { email, password });
            alert('Login enviado! Email: ' + email);
        });
    </script>
</body>
</html>
