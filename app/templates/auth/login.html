<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <title>Zapp - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IM+Fell+Great+Primer+SC&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 24px 50px 24px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header-link {
            display: flex;
            align-items: center;
            gap: 20px;
            text-decoration: none;
            cursor: pointer;
        }

        .logo {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }

        .brand-name {
            font-family: 'IM Fell Great Primer SC', serif;
            font-size: 64px;
            font-weight: 400;
            color: #000;
            line-height: 1;
        }

        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .login-box {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 56px;
            font-weight: 600;
            color: #000;
            margin-bottom: 16px;
            line-height: 1;
        }

        .subtitle {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            font-family: 'Instrument Sans', sans-serif;
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background-color: #f5f5f5;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4A90E2;
            background-color: #fff;
        }

        input::placeholder {
            color: #999;
        }

        input.error {
            border-color: #e53e3e;
            background-color: #fff5f5;
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 16px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-error {
            background-color: #fed7d7;
            color: #c53030;
            border: 1px solid #fc8181;
        }

        .alert-success {
            background-color: #c6f6d5;
            color: #2f855a;
            border: 1px solid #68d391;
        }

        .password-input {
            position: relative;
        }

        .password-input input {
            padding-right: 50px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password svg {
            width: 24px;
            height: 24px;
            stroke: #666;
            stroke-width: 2.5;
            fill: none;
        }

        .forgot-password {
            text-align: left;
            margin-bottom: 24px;
        }

        .forgot-password a {
            font-family: 'Instrument Sans', sans-serif;
            color: #000;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-button {
            font-family: 'Instrument Sans', sans-serif;
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            border: none;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .login-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(74, 144, 226, 0.4);
        }

        .login-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4A90E2;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header {
                padding: 24px 30px;
            }
            
            .logo {
                width: 38px;
                height: 38px;
            }
            
            .brand-name {
                font-size: 32px;
            }
            
            h1 {
                font-size: 32px;
            }
            
            .login-box {
                max-width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="header-link">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Zapp Logo" class="logo">
            <span class="brand-name">Zapp</span>
        </a>
    </div>

    <div class="login-container">
        <div class="login-box">
            <h1>Login</h1>
            <p class="subtitle">Acesse sua conta para gerenciar sua loja</p>

            <div id="alert-container" class="alert"></div>

            <div id="form-container">
                <form id="loginForm">
                    <div class="input-group">
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="nome@exemplo.com"
                            required
                        >
                        <div class="error-message" id="error-email"></div>
                    </div>

                    <div class="input-group password-input">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="senha forte"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <svg viewBox="0 0 24 24" id="eyeIcon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                        <div class="error-message" id="error-password"></div>
                    </div>

                    <div class="forgot-password">
                        <a href="#" onclick="handleForgotPassword(event)">Esqueci minha senha</a>
                    </div>

                    <button type="submit" class="login-button" id="btn-login">
                        Acessar a minha loja
                    </button>
                </form>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="color: #4A90E2; font-size: 18px;">Entrando...</p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            const isPassword = passwordInput.type === 'password';
            
            passwordInput.type = isPassword ? 'text' : 'password';
            
            if (isPassword) {
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            alert('Funcionalidade de recuperação de senha será implementada aqui!');
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            document.querySelectorAll('input').forEach(el => {
                el.classList.remove('error');
            });
            const alertEl = document.getElementById('alert-container');
            alertEl.classList.remove('show', 'alert-error', 'alert-success');
            alertEl.textContent = '';
        }

        function showError(field, message) {
            const errorEl = document.getElementById(`error-${field}`);
            const inputEl = document.getElementById(field);
            
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
            }
            if (inputEl) {
                inputEl.classList.add('error');
            }
        }

        function showAlert(message, type = 'error') {
            const alertEl = document.getElementById('alert-container');
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type} show`;
        }

        function toggleLoading(show) {
            document.getElementById('form-container').style.display = show ? 'none' : 'block';
            document.getElementById('loading').classList.toggle('show', show);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearErrors();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btnLogin = document.getElementById('btn-login');

            const data = {
                email: email,
                password: password
            };

            try {
                toggleLoading(true);
                btnLogin.disabled = true;

                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log('Resposta da API:', result);

                if (result.success) {
                    showAlert('Login realizado com sucesso! Redirecionando...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = result.data.redirect_url;
                    }, 1000);
                } else {
                    toggleLoading(false);
                    btnLogin.disabled = false;

                    if (result.errors) {
                        Object.keys(result.errors).forEach(field => {
                            showError(field, result.errors[field]);
                        });
                    } else {
                        showAlert(result.error || 'Erro ao fazer login');
                    }
                }
            } catch (error) {
                toggleLoading(false);
                btnLogin.disabled = false;
                console.error('Erro:', error);
                showAlert('Erro ao conectar com o servidor. Tente novamente.');
            }
        });

        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
