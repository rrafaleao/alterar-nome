<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zapp - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IM+Fell+Great+Primer+SC&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .brand-name {
            font-family: 'IM Fell Great Primer SC', serif;
            font-size: 28px;
            font-weight: 400;
            color: #000;
        }

        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
        }

        .subtitle {
            font-family: 'Instrument Sans', sans-serif;
            font-size: 14px;
            color: #666;
            margin-bottom: 40px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        input {
            font-family: 'Instrument Sans', sans-serif;
            width: 100%;
            padding: 14px 16px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f5f5f5;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #4A90E2;
            background-color: #fff;
        }

        input::placeholder {
            color: #999;
        }

        .password-input {
            position: relative;
        }

        .password-input input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #666;
            font-size: 18px;
        }

        .forgot-password {
            text-align: left;
            margin-bottom: 24px;
        }

        .forgot-password a {
            font-family: 'Instrument Sans', sans-serif;
            color: #000;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .login-button {
            font-family: 'Instrument Sans', sans-serif;
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 500;
            color: #fff;
            background: linear-gradient(135deg, #4A90E2 0%, #357ABD 100%);
            border: none;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(74, 144, 226, 0.4);
        }

        .login-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="https://dl.airtable.com/.blockIconImages/a30bee50aeefaf4ffd8c4dc699b642c6/d3accafa" alt="Zapp Logo" class="logo">
        <span class="brand-name">Zapp</span>
    </div>

    <div class="login-container">
        <div class="login-box">
            <h1>Login</h1>
            <p class="subtitle">Acesse sua conta para gerenciar sua loja</p>

            <form id="loginForm">
                <div class="input-group">
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="nome@exemplo.com"
                        required
                    >
                </div>

                <div class="input-group password-input">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="senha forte"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        👁️
                    </button>
                </div>

                <div class="forgot-password">
                    <a href="#" onclick="handleForgotPassword(event)">Esqueci minha senha</a>
                </div>

                <button type="submit" class="login-button">
                    Acessar a minha loja
                </button>
            </form>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            alert('Funcionalidade de recuperação de senha será implementada aqui!');
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Login attempt:', { email, password });
            alert('Login enviado! Email: ' + email);
        });
    </script>
</body>
</html>
